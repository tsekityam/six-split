name: Generate package-lock

on:
  push:
    paths:
      - '.github/workflows/generate-lock.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-lock
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package-lock.json
        run: npm install --package-lock-only
      - name: Commit lockfile
        run: |
          set -euo pipefail
          test -s package-lock.json
          node -e 'const j=require("./package-lock.json"); if(j.lockfileVersion!==3) throw new Error("bad lock"); console.log("packages", Object.keys(j.packages).length, "bytes", require("fs").statSync("package-lock.json").size)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
            exit 0
          fi
          git commit -m "Add package-lock.json for npm ci / setup-node cache"
          git push
